<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 Acerte o Alvo Neon!</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle, #1a1a2e, #0f0f1a);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game {
      width: 95%;
      max-width: 800px;
      height: 600px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      padding: 20px;
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      transition: all 0.3s ease;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00f2fe;
    }
    p {
      font-size: 18px;
      color: #b3b3b3;
      margin-bottom: 25px;
    }
    button {
      border: none;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      padding: 0 30px;
      font-size: 22px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    #score-box { color: #00f2fe; }
    #time-box { color: #ff4757; }
    #area {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
    }
    #target {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #fff 20%, currentColor 21%, currentColor 45%, #fff 46%, #fff 65%, currentColor 66%);
      cursor: pointer;
      display: none;
      transition: transform 0.1s ease;
      filter: drop-shadow(0 0 10px currentColor);
    }
    #target:active {
      transform: scale(0.8);
    }
    #gameOver {
      display: none;
      z-index: 10;
    }
    #finalScore {
      font-size: 45px;
      font-weight: bold;
      color: #00ff87;
      margin: 15px 0 30px 0;
      text-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
    }
  </style>
</head>
<body>

  <div id="game">
    <!-- TELA INICIAL -->
    <div id="menu" class="screen">
      <h1>🎯 Target Clicker Neon</h1>
      <p>O alvo vai mudar de cor e lugar. Quantos cliques você consegue dar em 30 segundos?</p>
      <button onclick="startGame()">COMEÇAR JOGO</button>
    </div>

    <!-- PLACAR (HUD) -->
    <div id="hud">
      <span id="score-box">🎯 Pontos: <span id="score">0</span></span>
      <span id="time-box">⏱️ Tempo: <span id="time">30</span>s</span>
    </div>

    <!-- ÁREA DE JOGO -->
    <div id="area">
      <div id="target" onclick="hitTarget()"></div>
    </div>

    <!-- TELA DE FIM DE JOGO -->
    <div id="gameOver" class="screen">
      <h1>🏆 Fim de Jogo!</h1>
      <p>Sua pontuação final foi:</p>
      <div id="finalScore">0 pontos</div>
      <button onclick="startGame()">JOGAR NOVAMENTE</button>
    </div>
  </div>

  <script>
    let score = 0;
    let time = 30;
    let timer;
    
    const menu = document.getElementById("menu");
    const hud = document.getElementById("hud");
    const area = document.getElementById("area");
    const target = document.getElementById("target");
    const gameOver = document.getElementById("gameOver");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const finalScore = document.getElementById("finalScore");

    const colors = ['#ff4757', '#00f2fe', '#00ff87', '#ffa502', '#eccc68', '#ff6b81'];

    function startGame() {
      score = 0;
      time = 30;
      scoreText.textContent = score;
      timeText.textContent = time;
      
      menu.style.display = "none";
      gameOver.style.display = "none";
      hud.style.display = "flex";
      area.style.display = "block";
      target.style.display = "block";
      
      moveTarget();
      clearInterval(timer);
      
      timer = setInterval(function() {
        time--;
        timeText.textContent = time;
        if (time <= 0) {
          endGame();
        }
      }, 1000);
    }

    function hitTarget() {
      score++;
      scoreText.textContent = score;
      moveTarget();
    }

    function moveTarget() {
      const areaWidth = area.clientWidth;
      const areaHeight = area.clientHeight;
      
      const maxX = areaWidth - 75;
      const maxY = areaHeight - 75;
      
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      
      // Muda a cor do alvo aleatoriamente
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      target.style.color = randomColor;
      
      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function endGame() {
      clearInterval(timer);
      target.style.display = "none";
      hud.style.display = "none";
      area.style.display = "none";
      gameOver.style.display = "flex";
      finalScore.textContent = score + " pontos 🎯";
    }
  </script>
</body>
</html>
